<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flash 视频倍速</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span class="logo">ϟ</span><div><h1>Flash</h1><small>VIDEO SPEED CONTROL</small></div><label class="enable"><input id="enabled" type="checkbox">启用</label></header>
<main><p class="caption">播放速度</p><div class="speed"><button id="minus" aria-label="降低 0.1 倍">−</button><input id="speed" type="number" min="0" step="any" aria-label="自定义播放倍率"><b>×</b><button id="plus" aria-label="提高 0.1 倍">＋</button></div><p class="hint">任意正数 · 推荐 0.1–16× · 回车或失焦应用</p><div id="presets"></div><label><input id="autoApply" type="checkbox"> 自动应用新视频</label><label><input id="remember" type="checkbox"> 记住当前速度</label><button id="panel" class="primary">显示 / 隐藏网页面板</button><p id="status" role="status">正在连接当前页面…</p></main><footer>Alt + Shift + &lt; / &gt; 调速 · 0 复位</footer><script src="popup.js"></script></body></html>
